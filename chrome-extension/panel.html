<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>飞书选文查询</title>
    <link rel="stylesheet" href="panel.css" />
    <script type="module" src="src/panel.js"></script>
  </head>
  <body>
    <header>
      <span class="brand-mark" aria-hidden="true">选</span>
      <div>
        <h1>选文查询</h1>
        <p>从文档出发，获取相关信息</p>
      </div>
    </header>
    <main>
      <details id="configuration">
        <summary>接口设置 <span id="config-label">尚未配置</span></summary>
        <form id="settings-form">
          <label for="endpoint">接口地址</label>
          <input
            id="endpoint"
            type="url"
            placeholder="https://api.example.com/query"
            required
          />
          <div class="row">
            <div>
              <label for="method">请求方式</label
              ><select id="method">
                <option>POST</option>
                <option>GET</option>
              </select>
            </div>
            <div>
              <label for="field">选文参数名</label
              ><input
                id="field"
                value="text"
                required
                pattern="[A-Za-z_][A-Za-z0-9_.\-]{0,63}"
              />
            </div>
          </div>
          <label for="token"
            >Bearer Token <span class="muted">可选</span></label
          >
          <input
            id="token"
            type="password"
            autocomplete="off"
            placeholder="仅保留到本次浏览器会话结束"
          />
          <p class="hint">
            只发送你主动查询的选中文字。POST 使用 JSON；GET
            使用查询参数。接口域名将在保存时授权。
          </p>
          <button type="submit" class="primary" id="save">
            保存并授权接口
          </button>
          <p id="settings-status" role="status"></p>
        </form>
      </details>

      <section aria-labelledby="selection-title">
        <div class="section-heading">
          <h2 id="selection-title">所选内容</h2>
          <span id="selection-count" class="muted">0 字符</span>
        </div>
        <textarea
          id="selection"
          rows="5"
          maxlength="20000"
          placeholder="在飞书文档中选中文字，右键选择「查询所选内容」。也可以在这里粘贴内容。"
        ></textarea>
        <div class="actions">
          <span id="destination" class="muted">请先配置查询接口</span
          ><button id="query" class="primary">查询</button>
        </div>
      </section>

      <section aria-labelledby="result-title" class="result-section">
        <div class="section-heading">
          <h2 id="result-title">查询结果</h2>
          <button id="copy" class="text-button" disabled>复制结果</button>
        </div>
        <div id="result-status" role="status" aria-live="polite">等待查询</div>
        <div id="empty-state">
          <div class="empty-symbol" aria-hidden="true">↗</div>
          <p>选一段文字，开始查询</p>
          <span>返回的 JSON 或文本将显示在这里</span>
        </div>
        <pre id="result" hidden></pre>
        <p id="result-error" role="alert" hidden></p>
      </section>
      <footer>支持飞书与 Lark 文档 · 查询记录仅保留在当前浏览器会话</footer>
    </main>
  </body>
</html>
